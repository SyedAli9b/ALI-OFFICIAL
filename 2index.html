
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALI.OFFICIAL | Cricket Results</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#07111f;
    color:white;
}

/* NAVBAR */
nav{
    height:70px;
    background:#0b1728;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 7%;
    border-bottom:1px solid #1d3048;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#00e676;
}

nav button{
    background:#00e676;
    border:0;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

/* HERO */
.hero{
    text-align:center;
    padding:70px 20px 45px;
}

.hero h1{
    font-size:48px;
}

.hero h1 span{
    color:#00e676;
}

.hero p{
    margin-top:15px;
    color:#9fb0c5;
}

/* RESULTS */
.container{
    width:90%;
    max-width:1100px;
    margin:auto;
}

.section-title{
    margin:30px 0 20px;
    font-size:28px;
}

.results{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:#0d1b2e;
    border:1px solid #1c3049;
    border-radius:15px;
    padding:22px;
}

.card .date{
    color:#8da1b8;
    font-size:14px;
}

.card h3{
    margin:12px 0;
}

.team{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #20344c;
}

.winner{
    color:#00e676;
    font-weight:bold;
}

.status{
    margin-top:15px;
    color:#00e676;
    font-weight:bold;
}

/* DASHBOARD */
#dashboard{
    display:none;
    position:fixed;
    inset:0;
    background:#07111f;
    overflow:auto;
    z-index:100;
}

.dashboard{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

.dashboard-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.dashboard-header h2{
    color:#00e676;
}

.close{
    background:#e53935;
    color:white;
    border:0;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
}

.panel{
    background:#0d1b2e;
    padding:25px;
    border-radius:15px;
    border:1px solid #1c3049;
}

input, textarea{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    background:#07111f;
    border:1px solid #304761;
    border-radius:8px;
    color:white;
}

textarea{
    height:100px;
    resize:none;
}

.add-btn{
    width:100%;
    padding:14px;
    background:#00e676;
    border:0;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.delete-btn{
    background:#e53935;
    color:white;
    border:0;
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}

/* LOGIN */
#login{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    z-index:200;
    align-items:center;
    justify-content:center;
}

.login-box{
    width:90%;
    max-width:400px;
    background:#0d1b2e;
    padding:30px;
    border-radius:15px;
    border:1px solid #29435f;
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
}

.login-btn{
    width:100%;
    padding:13px;
    background:#00e676;
    border:0;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.error{
    color:#ff5252;
    text-align:center;
    margin-top:12px;
}

/* FOOTER */
footer{
    margin-top:70px;
    padding:25px;
    text-align:center;
    color:#7f91a5;
    background:#0b1728;
}

@media(max-width:600px){
    .hero h1{
        font-size:36px;
    }

    nav{
        padding:0 5%;
    }

    .logo{
        font-size:19px;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="logo">ALI.OFFICIAL</div>
    <button onclick="openLogin()">OWNER LOGIN</button>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>ALI.<span>OFFICIAL</span></h1>
    <p>Daily Cricket Results • Scores • Match Updates</p>
</section>

<!-- RESULTS -->
<div class="container">

    <h2 class="section-title">Latest Cricket Results</h2>

    <div class="results" id="results"></div>

</div>

<footer>
    © 2026 ALI.OFFICIAL • Daily Cricket Results
</footer>


<!-- LOGIN -->
<div id="login">

    <div class="login-box">

        <h2>Owner Login</h2>

        <input
            type="email"
            id="email"
            placeholder="Owner Email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button class="login-btn" onclick="login()">
            LOGIN
        </button>

        <p class="error" id="loginError"></p>

    </div>

</div>


<!-- DASHBOARD -->
<div id="dashboard">

    <div class="dashboard">

        <div class="dashboard-header">

            <h2>ALI.OFFICIAL Dashboard</h2>

            <button class="close" onclick="closeDashboard()">
                Logout
            </button>

        </div>

        <div class="panel">

            <h3>Add Cricket Result</h3>

            <br>

            <label>Match</label>

            <input
                id="match"
                placeholder="Pakistan vs India"
            >

            <label>Date</label>

            <input
                type="date"
                id="date"
            >

            <label>Team 1 Score</label>

            <input
                id="team1"
                placeholder="Pakistan - 250/8"
            >

            <label>Team 2 Score</label>

            <input
                id="team2"
                placeholder="India - 245/10"
            >

            <label>Winner</label>

            <input
                id="winner"
                placeholder="Pakistan won by 5 runs"
            >

            <button class="add-btn" onclick="addResult()">
                ADD RESULT
            </button>

        </div>

    </div>

</div>


<script>

/*
    DEMO OWNER LOGIN

    IMPORTANT:
    This is NOT a secure real-world authentication system.
    A real website needs a backend/database.
*/

const OWNER_EMAIL = "farahn8875@gmail.com";

/*
   Demo password.
   Change this for testing.
*/
const OWNER_PASSWORD = "ALI12345";


let results =
JSON.parse(localStorage.getItem("cricketResults")) || [

    {
        match:"Pakistan vs India",
        date:"2026-08-19",
        team1:"Pakistan - 250/8",
        team2:"India - 245/10",
        winner:"Pakistan won by 5 runs"
    }

];


/* SHOW RESULTS */

function showResults(){

    const box = document.getElementById("results");

    box.innerHTML = "";

    if(results.length === 0){

        box.innerHTML =
        "<p>No cricket results available.</p>";

        return;
    }

    results.forEach((r,index)=>{

        box.innerHTML += `

        <div class="card">

            <div class="date">
                ${r.date}
            </div>

            <h3>${r.match}</h3>

            <div class="team">
                <span>${r.team1}</span>
            </div>

            <div class="team">
                <span>${r.team2}</span>
            </div>

            <div class="status">
                ${r.winner}
            </div>

            <button
                class="delete-btn"
                onclick="deleteResult(${index})">

                Delete

            </button>

        </div>

        `;

    });

}


/* LOGIN WINDOW */

function openLogin(){

    document.getElementById("login").style.display="flex";

}


/* LOGIN */

function login(){

    let email =
    document.getElementById("email").value;

    let password =
    document.getElementById("password").value;

    if(
        email === OWNER_EMAIL &&
        password === OWNER_PASSWORD
    ){

        document.getElementById("login").style.display="none";

        document.getElementById("dashboard").style.display="block";

        document.getElementById("loginError").innerText="";

    }else{

        document.getElementById("loginError").innerText =
        "Invalid owner email or password.";

    }

}


/* CLOSE DASHBOARD */

function closeDashboard(){

    document.getElementById("dashboard").style.display="none";

    document.getElementById("email").value="";
    document.getElementById("password").value="";

}


/* ADD RESULT */

function addResult(){

    let match =
    document.getElementById("match").value;

    let date =
    document.getElementById("date").value;

    let team1 =
    document.getElementById("team1").value;

    let team2 =
    document.getElementById("team2").value;

    let winner =
    document.getElementById("winner").value;


    if(
        !match ||
        !date ||
        !team1 ||
        !team2 ||
        !winner
    ){

        alert("Please fill all fields.");

        return;
    }


    results.unshift({

        match:match,
        date:date,
        team1:team1,
        team2:team2,
        winner:winner

    });


    localStorage.setItem(
        "cricketResults",
        JSON.stringify(results)
    );


    showResults();


    document.getElementById("match").value="";
    document.getElementById("date").value="";
    document.getElementById("team1").value="";
    document.getElementById("team2").value="";
    document.getElementById("winner").value="";


    alert("Cricket result added successfully!");

}


/* DELETE RESULT */

function deleteResult(index){

    if(confirm("Delete this result?")){

        results.splice(index,1);

        localStorage.setItem(
            "cricketResults",
            JSON.stringify(results)
        );

        showResults();

    }

}


/* START */

showResults();

</script>

</body>
</html>
